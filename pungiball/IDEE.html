<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(900px 500px at 50% -10%,#1b2145,#0b0d1a 60%);color:#eef1ff;
       font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:20px}
  .box{background:#141830;border:1px solid #ffc531;border-radius:20px;padding:36px 30px;
       width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}

  h1 b{color:#ffc531}
  p{color:#8b93b8;font-size:.82rem;margin-bottom:20px}
  input{width:100%;background:#0b0d1a;border:1px solid #2a3160;border-radius:10px;color:#eef1ff;
        padding:12px 14px;font-size:1rem;text-align:center;letter-spacing:2px}
  input:focus{border-color:#ffc531;outline:none}
  button{width:100%;margin-top:12px;background:linear-gradient(180deg,#ffc531,#ff9d00);border:none;
         border-radius:10px;color:#201400;font-weight:800;padding:12px;font-size:1rem;cursor:pointer}
  .err{color:#ff5470;font-size:.8rem;margin-top:12px;display:none}
  .shake{animation:sh .4s}
  @keyframes sh{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
</style>

<script>
const KEY='pb_gate_pw';
const $=i=>document.getElementById(i);
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
async function dec(pw){
  const raw=Uint8Array.from(atob($('blob').textContent.trim()),c=>c.charCodeAt(0));
  const salt=raw.slice(8,16), ct=raw.slice(16);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,384);
  const kb=new Uint8Array(bits);
  const key=await crypto.subtle.importKey('raw',kb.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:kb.slice(32,48)},key,ct));
}
async function go(){
  const pw=$('pw').value; if(!pw)return;
  try{
    const html=await dec(pw);
    localStorage.setItem(KEY,pw);
    document.open();document.write(html);document.close();
  }catch(e){
    $('err').style.display='block';
    $('box').classList.remove('shake');void $('box').offsetWidth;$('box').classList.add('shake');
    $('pw').select();
  }
}
const saved=localStorage.getItem(KEY);
if(saved){$('pw').value=saved;go();}
</script>
